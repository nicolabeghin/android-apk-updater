plugins {
    id 'com.android.library' version '8.11.2'
    id 'maven-publish'
}

android {
    namespace 'com.nbeghin.apkupdater'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}

// JitPack runs `./gradlew publishToMavenLocal` and rewrites group/version from the git tag,
// so these coordinates only matter for local builds.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.nicolabeghin'
                artifactId = 'android-apk-updater'
                version = '0.1.1'
            }
        }
    }
}
